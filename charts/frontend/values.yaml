replicaCount: 1

image:
    repository: richardprax/devops-github-frontend
    tag: latest-helm
    pullPolicy: IfNotPresent

service:
    type: ClusterIP
    port: 3000

ingress:
    enabled: true
    host: frontend.local
    path: /

app:
    # API URL for the backend - using external ingress URL
    apiUrl: "http://backend.local"
